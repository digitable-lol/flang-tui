#
# Проверки flang-tui на каждый толчок.
#
# Компилятор flang — один двоичный файл, которому нужен только `cc`, поэтому он
# собирается прямо здесь из своего же клона: ни Node, ни Python в этом
# конвейере нет ни в одном шаге. Go ставится ТОЛЬКО ради напечатанного кода
# (`gofmt`, `go vet`, `go build` над `out-go/`) — рукописного Go в дереве нет
# ни строкой, и отдельный шаг это проверяет.
#
# КАЖДЫЙ ШАГ — ЯРЛЫК, а не своя строка. Проверка, которую нельзя повторить у
# себя одной командой, проверкой не считается: до 2 сентября 2026 два шага жили
# только здесь, и повторить их было нечем.
#
# НИ ОДНОГО КОНВЕЙЕРА ЧЕРЕЗ `|` НАД ПРОВЕРЯЮЩЕЙ КОМАНДОЙ. Оболочка шагов —
# `bash -e` без `pipefail`, поэтому `flang check --proof "$m" | tail -8` отдаёт
# код `tail`, то есть всегда ноль: так шаг «Ведомость доказательств» в обоих
# репозиториях полгода не мог покраснеть. Ярлык `ведомость` печатает целиком и
# отдаёт свой код.
name: Проверки

"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux — проверка, ведомость, печать в Go и в C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          check-latest: false

      - name: Компилятор flang
        run: |
          git clone --depth 1 https://github.com/digitable-lol/flang.git /tmp/flang-src
          make -C /tmp/flang-src/bootstrap -j4
          echo "/tmp/flang-src/bootstrap" >> "$GITHUB_PATH"

      - name: Список ярлыков читается двоичным
        run: ./ярлык

      - name: Разбор, типы, завершаемость, примеры
        run: ./ярлык проверка

      - name: Ведомость доказательств — печатается, а не подразумевается
        run: ./ярлык ведомость

      - name: Печать в Go и в C, сборка обеих
        run: ./ярлык печать

      # Ф3 из README: вшитый предел глубины вызовов напечатанной программы —
      # 10 000, и полоса шириной 10 000 в него не влезает. Раньше это мерил
      # Go-сверщик через ctx.MaxDepth; теперь это делает НАПЕЧАТАННЫЙ в C
      # прогонщик, и Go для замера не нужен вовсе.
      - name: Ф3 — где кончается предел глубины напечатанной программы
        run: ./ярлык пределы

      - name: Лицензионный сторож
        run: ./ярлык лицензии

      # Сторож читает файлы по списку `git ls-files`, а нечитаемое пропускает
      # молча. 2 сентября 2026 этим пропуском из-под него выпали два
      # кириллических имени: `git` отдал их экранированными, файлов с такими
      # именами нет, чтение отказало — и сторож ответил «бед 0», не посмотрев
      # на них. Здесь считается, что прочитано РОВНО столько файлов, сколько в
      # дереве.
      - name: Сторож посмотрел на каждый файл, а не пропустил молча
        run: |
          ./ярлык лицензии > "$RUNNER_TEMP/guard.json"
          listed=$(git ls-files | wc -l)
          read_n=$(grep -o '"Прочитать файл"' "$RUNNER_TEMP/guard.json" | wc -l)
          echo "в дереве $listed, прочитано $read_n"
          test "$listed" = "$read_n" || { echo "сторож пропустил файлы" >&2; exit 1; }

      # Второй способ, нарочно тупой и не зависящий от flang: сам сторож — тоже
      # программа, и ошибиться он может (см. шаг выше).
      - name: В дереве нет Go, питона и JavaScript
        run: |
          bad=$(git ls-files | grep -E '\.(go|py|pyi|js|mjs|cjs|ts|tsx|jsx)$' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo "файл на чужом языке" >&2; exit 1; fi
          echo "чужого языка в дереве нет"

      - name: Ярлыка с опечаткой нет — оболочка отвечает кодом 2
        run: |
          set +e
          ./ярлык такого-ярлыка-нет >/dev/null 2>&1
          code=$?
          set -e
          test "$code" = "2" || { echo "ждали код 2, получили $code" >&2; exit 1; }
          echo "неизвестный ярлык отвергается кодом 2"

      - name: Дерево чистое
        run: |
          ./ярлык чисто
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "Проверки наследили в дереве." >&2
            exit 1
          fi
